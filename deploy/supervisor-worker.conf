; Queue worker — required from Phase 8 onward (order confirmation
; emails, vendor new-order alerts, low-stock notifications, status
; updates, chat message notifications are all queued jobs).
;
; Install: sudo cp deploy/supervisor-worker.conf /etc/supervisor/conf.d/
; Adjust `directory` and `user` below for your server first.

[program:markethub-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /path/to/markethub/artisan queue:work --sleep=3 --tries=3 --backoff=10 --max-time=3600
directory=/path/to/markethub
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/path/to/markethub/storage/logs/worker.log
stopwaitsecs=3600
