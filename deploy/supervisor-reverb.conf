; Laravel Reverb — required for Phase 9's real-time notifications and
; chat. Without this running the app still works; the bell badge and
; chat threads just fall back to next-page-load instead of live updates.
;
; Install: sudo cp deploy/supervisor-reverb.conf /etc/supervisor/conf.d/
; Adjust `directory` and `user` below for your server first.

[program:markethub-reverb]
process_name=%(program_name)s
command=php /path/to/markethub/artisan reverb:start --host=0.0.0.0 --port=8080
directory=/path/to/markethub
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/path/to/markethub/storage/logs/reverb.log
